<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>For you ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Section mot de passe -->
  <div class="container" id="passwordContainer">
    <h1>Jiji's official website :]</h1>
    <input type="password" id="passInput" placeholder="Tape le mot de passe">
    <button id="passBtn">Confirm</button>
    <p id="errorMsg" class="hidden">Password incorrect 😢</p>
  </div>

  <!-- Section message secret -->
  <div class="container hidden" id="loveContainer">
    <h1 id="title">I have something to tell you :]</h1>
    <button id="loveBtn">Click here ❤️</button>
    <p id="message" class="hidden">
      You are the prettiest ;) 💕  
      Happy valentines day 🌹
    </p>
  </div>

  <script src="script.js"></script>
</body>
</html>
